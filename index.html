<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla OAuth Callback</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
      color: #222;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    pre {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      word-break: break-all;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Tesla OAuth</h1>

  <div id="result">
    인증 결과를 확인하는 중...
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDescription = params.get("error_description");

  const result = document.getElementById("result");

  if (error) {

    result.innerHTML = `
      <p class="error">Tesla 인증에 실패했습니다.</p>
      <pre>${error}
${errorDescription || ""}</pre>
    `;

  } else if (code) {

    result.innerHTML = `
      <p class="success">Tesla 인증 코드를 정상적으로 받았습니다.</p>

      <p><strong>Authorization Code</strong></p>
      <pre>${code}</pre>

      <p><strong>State</strong></p>
      <pre>${state || "(없음)"}</pre>

      <p>
        이 페이지에서 확인한 Authorization Code는
        서버에서 Tesla Token API와 교환해야 합니다.
      </p>
    `;

  } else {

    result.innerHTML = `
      <p>아직 Tesla OAuth 인증 결과가 없습니다.</p>
      <p>
        Tesla 인증을 완료하면 이 페이지로 돌아오게 됩니다.
      </p>
    `;
  }
</script>

</body>
</html>
